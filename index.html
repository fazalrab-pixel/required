
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Required - Online Grocery Store</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f5f7f5;color:#222}
header{background:#159447;color:white;padding:18px}
header h1{margin:0;font-size:27px}
header p{margin:5px 0}
.search{padding:15px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.banner{margin:10px 15px;background:#d9f5df;padding:22px;border-radius:15px}
.banner h2{color:#087b35}
h2{padding:0 15px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}
.product{background:white;padding:12px;border-radius:13px;box-shadow:0 2px 7px #ddd}
.product img{width:100%;height:115px;object-fit:cover;border-radius:9px}
.product h3{font-size:16px;margin:9px 0}
.price{font-weight:bold;color:#168a40}
button{background:#159447;color:white;border:0;padding:11px;border-radius:8px;font-weight:bold;cursor:pointer}
.product button{width:100%;margin-top:8px}
.cart{background:white;margin:15px;padding:15px;border-radius:12px}
footer{text-align:center;padding:20px;background:#123b27;color:white}
</style>
</head>
<body>

<header>
<h1>Required 🛒</h1>
<p>Your Daily Grocery Store</p>
</header>

<div class="search">
<input id="search" placeholder="Search grocery products..." oninput="showProducts()">
</div>

<div class="banner">
<h2>Fresh Groceries at Your Doorstep!</h2>
<p>Sab kuch ek hi jagah par.</p>
</div>

<h2>Our Products</h2>
<div class="products" id="products"></div>

<div class="cart">
<h2>🛒 Your Cart</h2>
<div id="cart"></div>
<h3 id="total">Total: ₹0</h3>
<button onclick="checkout()">Place Order</button>
</div>

<footer>
<h3>Required Grocery Store</h3>
<p>Thank you for shopping with us!</p>
</footer>

<script>
const items=[
{name:"Fresh Apples",price:120,img:"https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400"},
{name:"Fresh Bananas",price:50,img:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=400"},
{name:"Tomatoes",price:40,img:"https://images.unsplash.com/photo-1546094096-0df4bcaaa337?w=400"},
{name:"Potatoes",price:30,img:"https://images.unsplash.com/photo-1518977676601-b53f82aba655?w=400"},
{name:"Milk",price:30,img:"https://images.unsplash.com/photo-1563636619-e9143da7973b?w=400"},
{name:"Bread",price:40,img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400"}
];
let basket=[];
function showProducts(){
let q=document.getElementById("search").value.toLowerCase();
document.getElementById("products").innerHTML=items.filter(x=>x.name.toLowerCase().includes(q)).map((x,i)=>`
<div class="product">
<img src="${x.img}">
<h3>${x.name}</h3>
<p class="price">₹${x.price}</p>
<button onclick="add(${items.indexOf(x)})">Add to Cart +</button>
</div>`).join("");
}
function add(i){basket.push(items[i]);showCart()}
function showCart(){
document.getElementById("cart").innerHTML=basket.map((x,i)=>`
<p>${x.name} - ₹${x.price} <button onclick="removeItem(${i})">Remove</button></p>`).join("") || "Your cart is empty";
let total=basket.reduce((s,x)=>s+x.price,0);
document.getElementById("total").innerText="Total: ₹"+total;
}
function removeItem(i){basket.splice(i,1);showCart()}
function checkout(){
if(!basket.length){alert("Please add products first!");return}
let message="Hello, I want to order:\n"+basket.map(x=>x.name+" - ₹"+x.price).join("\n")+"\nTotal: ₹"+basket.reduce((s,x)=>s+x.price,0);
alert(message+"\n\nOrder system will be connected in the next step.");
}
showProducts();showCart();
</script>
</body>
</html>
